# Copy to config.toml (next to the app, or the working directory in dev).

[database]
host = "localhost"
port = 5432
user = "postgres"
# Written as-is: characters like @ : / # need no escaping.
password = "postgres"
# Created at startup if it does not exist, then the tables are created by the embedded migrations.
dbname = "golf_report"
max_connections = 5

# Bend limits are references only; OK/NG always comes from the PLC.
# A station table written here replaces that station's defaults as a whole:
# write every key, a key left out is shown as "not configured".
[measurement.butt]
bend_min_mm = 50.0
bend_max_mm = 200.0

[measurement.tip]
bend_min_mm = 50.0
bend_max_mm = 200.0

# Recipe PLC transfer is locked until a technician signs off the actual machine.
# Acceptance must cover travel/load limits, FC16 device limit, and safe Ladder staging/handshake.
# No AS200 write limit has been supplied in the workbook. Never infer it from the read limit.
[recipe_transfer]
commissioned = false
confirmation_reference = ""
# max_write_words = <technician-confirmed FC16 limit, 1-123>
